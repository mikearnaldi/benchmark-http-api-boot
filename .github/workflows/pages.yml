# Publishes the committed report (reports/) to GitHub Pages. The benchmark
# itself is not run in CI: shared runners are too noisy for cold-start timings,
# so results are produced locally and committed.
name: Pages

on:
  push:
    branches: [main]
    paths: [reports/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir -p _site
          cp reports/report.html _site/index.html
          cp reports/*.json _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
